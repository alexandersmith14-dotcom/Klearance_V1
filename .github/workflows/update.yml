name: Update tracker

# Runs the full pipeline and publishes the refreshed dashboard.
#
# 06:30 UTC daily — early enough that the page is current before the US working
# day, late enough to pick up anything agencies posted the previous afternoon.
# GitHub schedules are best-effort and can lag by several minutes under load;
# that is fine for a daily regulatory tracker.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}      # lets you trigger a run by hand from the Actions tab
  # Deploy on push as well. Without this, code changes sat in the repo while the
  # published site stayed on whatever the last scheduled run produced — including
  # a search bug that had already been fixed in the repo. Classification is
  # incremental, so a push with no new agency items costs nothing.
  push:
    branches: [main]
    paths-ignore:
      - "README.md"          # docs-only edits don't need a redeploy

permissions:
  contents: write            # needed to commit the refreshed store and dashboard
  issues: write              # FinCEN 311 freshness check raises/closes an issue

concurrency:
  group: update-tracker      # never let two runs fight over store.json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch from agency sources
        run: python fetcher.py

      - name: Classify new items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py

      - name: Match Federal Register deadlines
        run: python deadlines.py

      # SAM.gov's index is fetched on scheduled / manual runs only (its public
      # API key has a low daily quota — a burst of push builds hits 429). On a
      # push build the fetch is skipped and sdn_monitor.py falls back to the
      # committed sdn_index_sam.json + sam_meta.json (see .gitignore).
      - name: Check OFAC SDN list for changes
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          # Set for schedule + workflow_dispatch, empty for push.
          FETCH_SAM: ${{ github.event_name != 'push' && '1' || '' }}
          # Cloudflare Worker fetch proxy for the AfDB debarment list. Both must
          # be set or fetch_afdb() raises and that one source is skipped. The
          # URL can be a repo Variable or Secret; the key must be a Secret.
          PROXY_WORKER_URL: ${{ vars.PROXY_WORKER_URL || secrets.PROXY_WORKER_URL }}
          WORKER_PROXY_KEY: ${{ secrets.WORKER_PROXY_KEY }}
        run: |
          [ -n "$PROXY_WORKER_URL" ] && echo "proxy url: set (${#PROXY_WORKER_URL} chars)" || echo "proxy url: EMPTY"
          [ -n "$WORKER_PROXY_KEY" ] && echo "proxy key: set (${#WORKER_PROXY_KEY} chars)" || echo "proxy key: EMPTY"
          python sdn_monitor.py

      - name: Build country-risk reference
        run: python country_risk.py

      - name: Build dashboard
        run: python dashboard.py

      # Report only — never fails this job. Publishing must not be blocked by a
      # single flaky agency site, so the gate runs as a separate job after the
      # deploy has already happened.
      - name: Check source health
        run: |
          python health.py --report-only | tee health.txt
          {
            echo "## Source health"
            echo '```'
            cat health.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: |
            health.json
            fetch_report.json
          retention-days: 90

      # sdn_monitor.py writes fincen311_stale.json listing FinCEN 311 measures
      # whose hand-mined enrichment (fincen311_details.csv) has fallen behind
      # the FinCEN table - a new/updated rule the docs were never mined from.
      # Keep one standing issue in sync with that list; close it when empty.
      # Scheduled/manual runs only, so a burst of code pushes doesn't churn it.
      - name: FinCEN 311 freshness issue
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python fincen311_issue.py

      - name: Commit refreshed data
        run: |
          git config user.name "regwatch-bot"
          git config user.email "actions@github.com"
          git add store.json dashboard.html sdn_log.json sdn_snapshot.json csl_snapshot.json fincen311_snapshot.json audit_log.jsonl
          # Nothing to do when no new items were published that day.
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update tracker data ($(date -u +%Y-%m-%d))"
            # main can move while this job runs (long pipeline steps above).
            # Rebase onto the latest and retry once before giving up.
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi

      - name: Assemble the published site
        # Pages serves index.html at the root, so the dashboard is copied to that
        # name. Keeping the build output as dashboard.html locally means the
        # local workflow is unchanged.
        run: |
          mkdir -p site
          cp dashboard.html site/index.html
          # The social preview card must be published too — og:image points at an
          # absolute URL on this site, and a 404 there means no LinkedIn preview.
          cp og-image.png site/og-image.png
          # Icons and manifest, referenced from <head>. Listed explicitly rather
          # than globbed so a missing one fails the build loudly instead of
          # publishing a page with a silently broken icon.
          cp favicon.ico site/favicon.ico
          cp icon-16.png site/icon-16.png
          cp icon-32.png site/icon-32.png
          cp icon-192.png site/icon-192.png
          cp icon-512.png site/icon-512.png
          cp icon-maskable-512.png site/icon-maskable-512.png
          cp apple-touch-icon.png site/apple-touch-icon.png
          cp site.webmanifest site/site.webmanifest
          # Footer headshot, referenced by dashboard.html's contact block.
          cp alexander-smith.png site/alexander-smith.png
          # No-op service worker — see its own file comment. Must be served from
          # the root: a worker's scope is capped at its own path, and root scope
          # is what the install-prompt check needs.
          cp sw.js site/sw.js
          # CFR text for the "Ask the regulations" panel. Retrieval runs in the
          # browser, so this must be published or the panel can only draw on the
          # tracked updates. Regenerate with: python ecfr_corpus.py
          cp corpus.json site/corpus.json
          # Subscribable calendar feed of upcoming deadlines, written by
          # dashboard.py in the build step above. Readers subscribe to this URL
          # once and new comment periods appear in their calendar automatically.
          cp deadlines.ics site/deadlines.ics
          # Hero background video, referenced by .hero-video's <source> in
          # dashboard.html. Copy the whole folder rather than the one file so
          # future hero assets don't need a workflow edit each time.
          mkdir -p site/assets/video
          cp assets/video/*.mp4 site/assets/video/
          # Spoken-summary clips, one MP3 per store key. dashboard.py's build
          # step reads ./audio to decide which items render an inline player
          # (AUDIO_KEYS); the files themselves must be published here or every
          # player 404s. Whole folder so new clips need no workflow edit.
          mkdir -p site/audio
          cp audio/*.mp3 site/audio/
          # Permalink pages (one per relevant update) and the sitemap listing
          # them, both written fresh by the dashboard.py build step above.
          mkdir -p site/updates
          cp updates/*.html site/updates/
          cp sitemap.xml site/sitemap.xml
          # Full-SDN-list search index, written by sdn_monitor.py above. Not
          # linked from any page's markup, just fetched by the dashboard's JS
          # on first use of the "search the full list" box.
          cp sdn_index.json site/sdn_index.json
          cp sdn_index_sam.json site/sdn_index_sam.json
          cp sdn_counts.json site/sdn_counts.json
          # Recent-SDN-changes feeds for periodic re-screening, written by
          # sdn_monitor.py alongside the index.
          cp sdn-changes.xml site/sdn-changes.xml
          cp sdn-changes.csv site/sdn-changes.csv
          # Static — same content every build, not regenerated by dashboard.py.
          cp robots.txt site/robots.txt
          # Google Search Console ownership verification. Must stay published
          # even after verification succeeds, or the property loses its
          # verified status the next time Google recheck it.
          cp google0b63d939a06e7f38.html site/google0b63d939a06e7f38.html

      - name: Publish to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs last, on purpose. The dashboard is already built, committed and
  # published by this point, so a broken source never blocks the site — it just
  # turns this run red, which is what sends the notification email.
  #
  # Only BROKEN sources fail it. A source that has merely gone quiet is reported
  # but does not fail: a daily check that cries wolf is a daily check you learn
  # to ignore.
  health-gate:
    needs: [update, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: health-report

      - name: Fail if any source is broken
        run: |
          python - <<'PY'
          import json, sys
          h = json.load(open("health.json"))
          broken = [s for s in h["sources"] if s["status"] == "BROKEN"]
          quiet = [s for s in h["sources"] if s["status"] == "QUIET"]
          for s in quiet:
              print(f"::warning title=Source quiet::{s['source']}: {s['detail']}")
          for s in broken:
              print(f"::error title=Source broken::{s['source']}: {s['detail']}")
          if broken:
              names = ", ".join(s["source"] for s in broken)
              sys.exit(f"\n{len(broken)} source(s) broken: {names}\n"
                       "The site published normally; these sources are missing from it.")
          print(f"All sources healthy ({len(quiet)} quiet).")
          PY

  # A red run relies on GitHub's own email notification, which depends on
  # per-user settings that can be off or missed. This is a second, explicit
  # channel: one open issue per failure, reused across repeat failures rather
  # than piling up duplicates, so it's impossible to miss on the repo's own
  # front page even if email notifications are muted.
  notify-failure:
    needs: [update, deploy, health-gate]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Run [${context.runId}](${runUrl}) failed.`,
              '',
              `- update: ${{ needs.update.result }}`,
              `- deploy: ${{ needs.deploy.result }}`,
              `- health-gate: ${{ needs.health-gate.result }}`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
            });

            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Update tracker run failed',
                body,
                labels: ['workflow-failure'],
              });
            }

  # Closes whatever notify-failure opened once a run goes fully green again,
  # so a fixed problem doesn't sit open indefinitely.
  close-failure-issue:
    needs: [update, deploy, health-gate]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by [${context.runId}](${runUrl}) — all jobs succeeded.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
