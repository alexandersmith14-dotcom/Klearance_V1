name = "regwatch-ask"
main = "worker.js"
compatibility_date = "2026-07-01"
# afdb.org (and other proxy targets) sit behind Cloudflare. Without this flag a
# Worker subrequest to another Cloudflare zone is rejected with error 1042. The
# flag routes the fetch over the public internet like any external client.
compatibility_flags = ["global_fetch_strictly_public"]

# The API key is a SECRET, never in this file and never in the published page:
#   npx wrangler secret put GROQ_API_KEY
#
# PROXY_KEY gates the GET /proxy?url= fetch-proxy route (used by fetcher.py to
# reach Cloudflare-fronted sources like the AfDB debarment list). Set the same
# value here and as the WORKER_PROXY_KEY GitHub Actions secret:
#   npx wrangler secret put PROXY_KEY
#
# Optional per-IP rate limiting. Create a KV namespace and uncomment to bind it:
#   npx wrangler kv namespace create RATELIMIT
# then paste the returned id below. Without it the Worker still enforces the
# size and token caps, it just will not count requests per address.
#
# [[kv_namespaces]]
# binding = "RATELIMIT"
# id = "paste-the-id-from-the-command-above"
